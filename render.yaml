services:
  - type: web
    name: chord-studio
    runtime: node
    plan: free
    region: frankfurt
    rootDir: web
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LOCAL_AUDIO_ENGINE_URL
        sync: false
      - key: LOCAL_AUDIO_ENGINE_TOKEN
        sync: false

  - type: web
    name: chord-studio-local-engine-chordino
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: LOCAL_AUDIO_ENGINE_TOKEN
        sync: false
